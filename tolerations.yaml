apiVersion: v1
kind: Pod

metadata:
  name: mypod
  labels:
    app: myapp

spec:
  tolerations:
    - key: "prob"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: mycontainer
      image: nginx:latest
      ports:
        - containerPort: 80

  nodeSelector:
    type: db