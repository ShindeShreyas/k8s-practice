apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: rs

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rs

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: rs

    spec:
      containers:
        - name: my-container
          image: nginx:latest

          ports:
            - name: nginx-port
              containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: my-service
  labels:
    app: rs

spec:
  type: NodePort

  selector:
    app: rs

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001


      
  