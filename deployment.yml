apiVersion: apps/v1
kind: Deployment
metadata:
  name: depolyment
  labels:
    app: deploy
spec:
  replica: 2
  selector:
    matchLabels:
      app: deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
      app: deploy
---
apiVersion: v1
kind: Services
metadata:
  name: deploy-svc
  labels:
    app: deploy
spec:
  type: NodePort
  selector:
    app: deploy
  port:
    - port: 80
      targetPort: 80
      NodePort: 30001

