apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-rs
  labels:
    app: myapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  serviceName: my-rs

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: mysql-cont
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: mysql_root_password # apply